version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: tablero-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-tablero}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-tablero}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - tablero-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tablero}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tablero-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-tablero}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: ${DB_NAME:-tablero}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET}
      APP_PASSWORD: ${APP_PASSWORD}
      PORT: ${PORT:-8080}
    ports:
      - "8080:8080"
    networks:
      - tablero-network

volumes:
  postgres_data:

networks:
  tablero-network:
    driver: bridge
